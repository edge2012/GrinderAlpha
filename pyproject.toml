[project]
name = "grinderalpha"
version = "0.2.0"
description = "GrinderAlpha — an engineering-grade investment decision system: deterministic engines + multi-agent LLM debate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GrinderAlpha" }]

[project.optional-dependencies]
backtest = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]
valuation = ["akshare>=1.12"]
debate = ["pydantic>=2.0", "langchain-openai>=0.1", "langchain-core>=0.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "investment",
    "investment.methodologies",
    "investment.sell_monitors",
    "investment.debate_engine",
    "backtest",
]
py-modules = ["bottom_accelerator", "valuation_engine"]
